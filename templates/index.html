<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betting Trend Spotter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Betting Trend Spotter</h1>
        <p class="sub">Markets standing out on Kalshi &amp; Polymarket — ranked by 24h price movement &times; trading volume.</p>
    </header>

    <section class="controls">
        <label>
            <span>Platform</span>
            <select id="platform">
                <option value="all">All</option>
                <option value="kalshi">Kalshi</option>
                <option value="polymarket">Polymarket</option>
            </select>
        </label>
        <label>
            <span>Min 24h Volume ($)</span>
            <input type="number" id="min_vol" value="1000" step="1000" min="0">
        </label>
        <label>
            <span>Min 24h Move (%)</span>
            <input type="number" id="min_move" value="2" step="1" min="0" max="100">
        </label>
        <label>
            <span>Show</span>
            <select id="limit">
                <option value="25">Top 25</option>
                <option value="50" selected>Top 50</option>
                <option value="100">Top 100</option>
            </select>
        </label>
        <button id="refresh" type="button">Refresh</button>
        <span id="status"></span>
    </section>

    <main id="markets"></main>

    <footer>
        <p>Data refreshes from each platform every minute. A high "standout score" means a sizeable price move with real volume behind it — worth a closer look, not investment advice.</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
